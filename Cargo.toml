[workspace]
members = ["ram-core", "ram-cli"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "CC0-1.0"

[workspace.dependencies]
aln-core = { git = "https://github.com/Dfam-consortium/dfam-lib", tag = "0.2.5" }
aln-coord = { git = "https://github.com/Dfam-consortium/dfam-lib", tag = "0.2.5" }
dfam-stk-io = { git = "https://github.com/Dfam-consortium/dfam-lib", tag = "0.2.5" }

[profile.release]
opt-level = 3
lto = "thin"

